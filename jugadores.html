<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://pomwgcnwygbqakbjizjf.supabase.co wss://pomwgcnwygbqakbjizjf.supabase.co https://cdn.jsdelivr.net;">
  <title>Chaos Jeopardy — Jugadores</title>
  <link rel="stylesheet" href="jugadores.css">
</head>
<body>

  <!-- Pantalla de registro -->
  <div id="vista-registro">
    <div id="registro-box">
      <h1>Chaos Jeopardy</h1>
      <p>Ingresá tu nombre para unirte</p>
      <input type="text" id="input-nombre" maxlength="10" placeholder="Tu nombre..." />
      <button onclick="registrarJugador()">Unirse</button>
      <p id="error-registro" class="error oculto">Ese nombre ya está en uso.</p>
    </div>
  </div>

  <!-- Vista espera lobby -->
  <div id="vista-espera" class="oculto">
    <div id="espera-box">
      <h1>Chaos Jeopardy</h1>
      <p id="espera-nombre"></p>
      <p class="subtitulo">Esperando a que el juego empiece...</p>
      <div class="spinner"></div>
    </div>
  </div>

  <!-- Vista dados -->
  <div id="vista-dados-jugador" class="oculto">
    <div id="dados-box">
      <h2>Tirada inicial</h2>
      <p class="subtitulo">Tirá el dado para determinar tu turno</p>
      <div id="btn-dado" onclick="tirarDado()">⬡</div>
      <p id="resultado-dado-jugador"></p>
    </div>
  </div>

  <!-- Pantalla de espera/juego -->
  <div id="vista-juego" class="oculto">
    <div id="juego-box">
      <h2 id="bienvenida"></h2>
      <p class="subtitulo">Esperando pregunta...</p>

      <div id="pantalla-pregunta-jugador" class="oculto">
        <h3 id="jugador-titulo-pregunta"></h3>
        <p id="jugador-descripcion-pregunta"></p>
      </div>

      <div id="puntaje-propio">
        <span>Tu puntaje:</span>
        <strong id="mi-puntaje">0</strong>
      </div>

      <div id="buzzer-btn" class="oculto" onclick="aprestarBuzzer()">
        ●
      </div>
      <div id="dado-jugador-contenedor" class="oculto">
        <div id="btn-dado-jugador" class="dado-jugador">⬡</div>
        <p id="dado-jugador-label">Presioná para tirar</p>
      </div>
    </div>
    <!-- Dado de categoría/pregunta -->
    
  </div>

  <script src="supabase.js"></script>
  <script src="jugadores.js"></script>
</body>
</html>
