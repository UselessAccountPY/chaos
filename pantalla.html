<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://pomwgcnwygbqakbjizjf.supabase.co wss://pomwgcnwygbqakbjizjf.supabase.co https://cdn.jsdelivr.net;">
  <title>Chaos Jeopardy — Pantalla</title>
  <link rel="stylesheet" href="pantalla.css">
</head>
<body>

  <!-- Vista lobby -->
  <div id="vista-lobby">
    <div id="lobby-contenido">
      <div id="circulo">
        <p>Aquí va el símbolo de caos</p>
      </div>
      <div id="jugadores-lobby"></div>
    </div>
  </div>
  
  <!-- Vista default: el círculo solo — se usa durante el juego -->
  <div id="vista-default" class="oculto">
    <div id="circulo-juego">
      <p>Aquí va el símbolo de caos</p>
    </div>
  </div>
  
  <!-- Vista pregunta -->
  <div id="vista-pregunta" class="oculto">
    <div id="box-pregunta">
      <p id="pantalla-categoria"></p>
      <h1 id="pantalla-titulo"></h1>
      <p id="pantalla-descripcion"></p>
      <div id="contador-amigo-pantalla" style="
        display: none;
        font-size: 4rem;
        font-weight: bold;
        color: #e74c3c;
        letter-spacing: 0.1rem;
        margin-top: 0.5rem;
      ">1:00</div>
    </div>
  </div>

  <!-- Vista dados -->
  <div id="vista-dados-pantalla" class="oculto">
    <div id="dados-pantalla-contenido">
      <h1>Tirada inicial</h1>
      <div id="lista-dados-pantalla"></div>
    </div>
  </div>
  
  <!-- Vista trivia niveles -->
  <div id="vista-trivia-niveles" class="oculto">
    <div id="box-trivia-niveles">
      <p id="trivia-categoria-label"></p>
      <h1 id="trivia-subcategoria"></h1>
      <div id="trivia-niveles-grid"></div>
    </div>
  </div>

  <!-- Barra de turnos abajo — siempre visible en fase juego -->
  <div id="barra-turnos" class="oculto">
    <span id="barra-ronda"></span>
    <div id="barra-jugadores"></div>
  </div>
  
  <!-- Overlay de puntajes -->
  <div id="overlay-puntajes" class="oculto">
    <div id="box-puntajes">
      <h2>Puntajes</h2>
      <div id="lista-puntajes"></div>
    </div>
  </div>
<!-- Overlay ruleta -->
  <div id="overlay-ruleta" class="oculto">
    <div id="ruleta-contenido">
      <div id="ruleta-wrapper">
        <div id="ruleta-indicador">▼</div>
        <div id="ruleta-svg-contenedor"></div>
      </div>
      <div id="ruleta-resultado-box" class="oculto">
        <h2 id="ruleta-categoria-nombre"></h2>
        <div id="ruleta-dado12-box" class="oculto">
          <span id="ruleta-dado12-valor"></span>
          <p>pregunta seleccionada</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Overlay power up saltar turno -->
  <div id="overlay-saltar" class="overlay-pu">
    <div class="overlay-pu-icono">⏭</div>
    <div id="overlay-saltar-texto" class="overlay-pu-texto"></div>
  </div>
  <!-- Overlay power up llamar a un amigo -->
  <div id="overlay-amigo" class="overlay-pu">
    <div class="overlay-pu-icono">📞</div>
    <div id="overlay-amigo-texto" class="overlay-pu-texto"></div>
  </div>
  
  <script src="pantalla.js"></script>
</body>
</html>
