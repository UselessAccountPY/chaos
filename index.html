<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://pomwgcnwygbqakbjizjf.supabase.co wss://pomwgcnwygbqakbjizjf.supabase.co https://cdn.jsdelivr.net;">
  <title>Chaos - Control</title>
  <link href="chaostheme.css" rel="stylesheet" type="text/css" media="all">
</head>
<body>

  <div id="vista-lobby-host">
    <h1>Chaos - Control del juego</h1>
    <p id="contador-jugadores">0 jugadores conectados</p>
    <div id="jugadores-lobby-host"></div>
    <button onclick="resetJuego()">🗑 Resetear jugadores</button>
    <button onclick="darDados()">🎲 Dar dados</button>
    <button onclick="asignacionManual()">✏️ Asignación manual</button>
  </div>

  <div id="vista-manual-host" class="oculto">
    <h1>Asignación manual</h1>
    <p>Ingresá el resultado del dado de cada jugador (1-12).</p>
    <div id="tabla-manual-host"></div>
    <button onclick="iniciarJuego()">▶ Iniciar juego</button>
  </div>
  
  <div id="vista-dados-host" class="oculto">
    <h1>Asignación virtual</h1>
    <p>Los jugadores están tirando el dado para determinar el orden de turnos.</p>
    <div id="tabla-turnos-host"></div>
    <button onclick="iniciarJuego()">▶ Iniciar juego</button>
  </div>
  
 <div id="vista-juego-host" class="oculto">

  <div id="juego-layout">

    <!-- Columna izquierda: panel control + categorias -->
    <div id="juego-col-izq">
      <div id="panel-control">
        <div id="panel-control-header">
          <span id="contador-ronda">Ronda 1</span>
          <div style="display:flex; gap:0.5rem;">
            <button id="btn-mostrar-puntajes" onclick="toggleMostrarPuntajes()">
              🏆 Mostrar puntajes
            </button>
            <button onclick="siguienteTurno()">⏭ Siguiente turno</button>
          </div>
        </div>
        <div id="panel-control-lista"></div>
      </div>
      <div id="category-buttons"></div>
      <div id="question-list"></div>
    </div>

    <!-- Columna derecha: consola de dados -->
    <div id="juego-col-der">
      <div id="consola-panel">
        <div id="consola-header">
          <span>🎲 Consola de dados</span>
          <button onclick="limpiarConsola()">🗑</button>
        </div>
        <div id="consola-dados"></div>
        <div id="consola-acciones">
          <p id="consola-estado-label">—</p>
          <div id="consola-botones-resultado"></div>
        </div>
      </div>
    </div>

  </div>

</div>
  
  <script src="script.js"></script>
  </body>
  </html>
